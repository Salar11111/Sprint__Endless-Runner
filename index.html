<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sprint — Endless Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="menu" class="screen">
      <div class="panel">
        <p class="eyebrow">Endless runner</p>
        <h1>SPRINT</h1>
        <p class="tagline">How far can you run?</p>
        <div class="controls" aria-label="Controls">
          <div class="control-row">
            <span class="key">Space</span>
            <span class="key">W</span>
            <span class="key">↑</span>
            <span class="key-label">Jump</span>
          </div>
          <div class="control-row">
            <span class="key">Tap</span>
            <span class="key-label">Jump</span>
          </div>
          <div class="control-row">
            <span class="key">Double tap</span>
            <span class="key-label">Double jump</span>
          </div>
        </div>
        <button id="startBtn" class="btn primary">Start</button>
      </div>
    </div>

    <div id="over" class="screen hidden">
      <div class="panel">
        <p class="eyebrow">Run complete</p>
        <h2>Game Over</h2>
        <p class="score-label">Score</p>
        <p class="big" id="finalScore">0</p>
        <p class="best" id="bestScore">Best: 0</p>
        <button id="restartBtn" class="btn primary">Run Again</button>
      </div>
    </div>

    <button id="muteBtn" class="mute" aria-label="Toggle sound">🔊</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
